<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Key Submissions 2026 — fictional demo</title><style>.keyView{font:14px 'Segoe UI',Arial,sans-serif;color:#19314c;background:#fff;box-sizing:border-box;padding:14px;position:relative;overflow:auto;container-type:inline-size;height:100%;width:100%;user-select:text}.keyView *{box-sizing:border-box}.keyView header{display:flex;align-items:center;justify-content:space-between;gap:12px}.keyView h1{font-size:21px;line-height:1.15;margin:0}.keyView .scope{font-size:12px;color:#53657b;margin:5px 0}.keyView .tally{font-size:12px;color:#445b7e;white-space:nowrap}.keyView .controls{margin:10px 0}.keyView input{font:inherit;width:100%;border:1px solid #aabbd0;border-radius:5px;padding:7px 9px;background:#f8faff;color:inherit}.keyView table{width:100%;border-collapse:collapse;table-layout:fixed}.keyView th{text-align:left;font-size:11px;letter-spacing:.2px;color:#546782;background:#edf3fa;padding:7px 5px}.keyView th:nth-child(1){width:47%}.keyView th:nth-child(2){width:22%}.keyView th:nth-child(3){width:31%}.keyView td{padding:5px;border-bottom:1px solid #e2e8f1;height:43px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.keyView tr:nth-child(even){background:#f8fafd}.keyView .record{font:600 12px 'Segoe UI',sans-serif;color:#15477e;border:0;border-bottom:1px dotted #567daa;background:transparent;padding:0;cursor:pointer;max-width:calc(100% - 17px);overflow:hidden;text-overflow:ellipsis;vertical-align:middle}.keyView .product{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.keyView .dot{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%}.keyView .dot.green{background:#168363}.keyView .dot.blue{background:#367dcc}.keyView .dot.amber{background:#b77c0b}.keyView .dot.red{background:#b84e55}.keyView .dot.grey{background:#7d8998}.keyView .country{font-size:12px}.keyView .milestone span{display:block;font-size:11px;color:#627189}.keyView .milestone strong{font-size:12px;font-weight:600}.keyView footer{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:12px;gap:6px}.keyView footer button,.keyView .close{border:1px solid #b3c3d7;background:#f4f7fc;color:#193b64;padding:5px 8px;border-radius:4px;cursor:pointer;font:inherit}.keyView button:disabled{opacity:.4;cursor:default}.keyView :focus-visible{outline:2px solid #397ddb;outline-offset:2px}.keyView .checks{font-size:11px;line-height:1.4;margin-top:9px;color:#61718a}.keyView .checks summary{cursor:pointer}.keyView .checks ul{max-height:140px;overflow:auto}.keyView .notice{background:#fff1d2;color:#614800;padding:10px;font-size:13px}.keyView .empty{padding:24px 8px;font-size:13px}.keyView .demo{font-size:11px;color:#6b7890;margin:3px 0}.keyView .detailPanel{position:absolute;inset:0;z-index:2;background:white;padding:18px;overflow:auto;border:1px solid #b7c8df;min-height:100%;user-select:text}.keyView .close{float:right}.keyView h2{margin:0 0 8px;font-size:20px}.keyView .status{font-weight:600}.keyView dl{font-size:14px;line-height:1.5;margin-top:16px}.keyView dt{font-size:12px;font-weight:600;color:#64738a;margin-top:12px}.keyView dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}@container(max-width:450px){.keyView h1{font-size:18px}.keyView .tally{white-space:normal;max-width:90px;text-align:right}}
body{margin:20px;background:#eaf0f8}#host{width:min(540px,100%);height:680px;margin:auto;box-shadow:0 8px 30px #192e4820;border-radius:8px}</style><div id="host"></div><script>const roles=['SubID','ROID','KeySubmission','BusinessUnit','Product','Country','Site','SubStatus','OriginalDispatch','LatestDispatch','ActualDispatch','LatestSubmission','ActualSubmission','LatestApproval','ActualApproval'];
const dateRoles=roles.slice(8);
const clean=v=>String(v??'').trim();
const isKey=v=>/^key submissions?$/.test(clean(v).toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' '));
function day(v){if(v==null||v==='')return null;let y,m,d;if(v instanceof Date){if(!Number.isFinite(+v))return NaN;y=v.getUTCFullYear();m=v.getUTCMonth()+1;d=v.getUTCDate();}else {const s=clean(v),a=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:T.*)?$/);if(!a||s.includes('T')&&!Number.isFinite(Date.parse(s)))return NaN;[,y,m,d]=a.map(Number);}const n=Date.UTC(y,m-1,d),dt=new Date(n);return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?n:NaN;}
function mapTable(table){const indices={},missing=[];for(const role of roles){const matches=(table?.columns||[]).flatMap((c,i)=>c.roles?.[role]?[i]:[]);if(matches.length>1)throw Error('Map only one column to '+role);if(matches.length)indices[role]=matches[0];}for(const k of ['SubID','KeySubmission','BusinessUnit'])if(indices[k]===undefined)missing.push(k);if(!['OriginalDispatch','LatestDispatch','ActualDispatch'].some(k=>indices[k]!==undefined))missing.push('a dispatch date');return {missing,rows:(table?.rows||[]).map(row=>Object.fromEntries(roles.map(k=>[k,indices[k]===undefined?null:row[indices[k]]])))};}
function collect(rows){
 const groups=new Map();let unidentified=0;for(const r of rows){const id=clean(r.SubID);if(!id){if(isKey(r.KeySubmission)&&clean(r.BusinessUnit).toUpperCase()==='ID')unidentified++;continue;}if(!groups.has(id))groups.set(id,[]);groups.get(id).push(r);}
 const records=[],excluded=[],undated=[],outside=[],qualifying=[];
 for(const [id,list]of groups){if(!list.some(r=>isKey(r.KeySubmission))||!list.some(r=>clean(r.BusinessUnit).toUpperCase()==='ID'))continue;qualifying.push(id);
  const values=k=>[...new Set(list.map(r=>clean(r[k])).filter(Boolean))].sort();const dates={},issues=[];
  for(const k of dateRoles){const vals=list.map(r=>day(r[k])),valid=[...new Set(vals.filter(v=>v!==null&&Number.isFinite(v)))];const issue=vals.some(Number.isNaN)||valid.length>1;dates[k]={value:issue?null:valid[0]??null,issue};if(issue)issues.push(k);}
  let chosen,source;for(const k of ['ActualDispatch','LatestDispatch','OriginalDispatch']){if(dates[k].issue||dates[k].value!==null){chosen=dates[k];source=k;break;}}
  if(chosen?.issue){excluded.push({id,reason:'Conflicting or invalid '+source});continue;}if(!chosen){undated.push(id);continue;}if(new Date(chosen.value).getUTCFullYear()!==2026){outside.push(id);continue;}
  let next='Dispatch',target=dates.LatestDispatch.value??dates.OriginalDispatch.value,complete=false;
  if(dates.ActualDispatch.value!==null){next='Submission';target=dates.LatestSubmission.value;if(dates.ActualSubmission.value!==null){next='Approval';target=dates.LatestApproval.value;}}
  if(dates.ActualApproval.value!==null){next='Approved';target=dates.ActualApproval.value;complete=true;}
  if(dates.ActualDispatch.issue||dates.ActualSubmission.issue||dates.ActualApproval.issue){next='Check dates';target=null;}
  if(next==='Dispatch'&&dates.LatestDispatch.issue)target=null;
  const statuses=values('SubStatus'),status=statuses.length===1?statuses[0]:statuses.length?'Multiple statuses':'Not provided';
  records.push({id,ros:values('ROID'),products:values('Product'),countries:values('Country'),sites:values('Site'),status,statuses,next,target,complete,dates,issues,scopeDate:chosen.value,scopeSource:source});
 }
 records.sort((a,b)=>Number(a.complete)-Number(b.complete)||(a.target??Infinity)-(b.target??Infinity)||a.id.localeCompare(b.id));
 return {records,excluded,undated,outside,qualifying,unidentified};
}
function selectPage(records,{query='',page=0,size=10}={}){const q=query.trim().toLowerCase(),matches=records.filter(r=>[r.id,...r.ros,...r.products,...r.countries,...r.sites,r.status].join(' ').toLowerCase().includes(q)),pages=Math.max(1,Math.ceil(matches.length/size)),index=Math.min(Math.max(0,page),pages-1);return {matches,page:index,pages,rows:matches.slice(index*size,(index+1)*size)};}

const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const fmt=n=>n===null?'Not provided':new Date(n).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
const joined=a=>a.length?a.join('; '):'Not provided';
const short=a=>a.length?(a[0]+(a.length>1?' +'+(a.length-1):'')):'Not provided';
const color=s=>/^(completed|approved|ha received)$/i.test(s)?'green':/^(in progress|sent to health authority|distributed|ready for submission)$/i.test(s)?'blue':/^(deferred|on hold.*)$/i.test(s)?'amber':/^(rejected|withdrawn|inactive)$/i.test(s)?'red':'grey';
function render(root,rows,{state={query:'',page:0,selected:null},onChange=(patch)=>{},missing=[],notice='',synthetic=false}={}){
 root.replaceChildren();root.className='keyView';const header=el('header'),title=el('div');title.append(el('h1','Key Submissions — 2026'),el('p','ID business unit · Dispatch year 2026','scope'));header.append(title);root.append(header);
 if(synthetic)root.append(el('p','Fictional demonstration data','demo'));
 if(notice)root.append(el('p',notice,'notice'));if(missing.length){root.append(el('p','Add '+missing.join(', ')+' to show the correct key submissions.','notice'));return;}
 const result=collect(rows),view=selectPage(result.records,state);const tally=el('strong',result.records.length+' key submissions','tally');header.append(tally);
 const controls=el('div',undefined,'controls'),search=el('input');search.type='search';search.placeholder='Search product, country or submission';search.value=state.query||'';search.setAttribute('aria-label','Search key submissions');search.oninput=()=>onChange({query:search.value,page:0,selected:null});controls.append(search);root.append(controls);
 const wrap=el('div',undefined,'tableWrap'),table=el('table'),head=el('tr');['Submission / Product','Country','Next milestone'].forEach(t=>head.append(el('th',t)));const thead=el('thead');thead.append(head);table.append(thead);const body=el('tbody');
 view.rows.forEach(r=>{const tr=el('tr'),main=el('td'),button=el('button',r.id,'record'),dot=el('span',undefined,'dot '+color(r.status));dot.title=r.status;dot.setAttribute('aria-label','Status: '+r.status);button.onclick=()=>onChange({selected:r.id});button.setAttribute('aria-label','Details for '+r.id);main.append(dot,button,el('span',short(r.products),'product'));main.title=joined(r.products)+'\nStatus: '+r.status;
 const country=el('td',short(r.countries),'country');country.title=joined(r.countries);const next=el('td',undefined,'milestone');next.append(el('span',r.next),el('strong',fmt(r.target)));next.title=r.next+' — '+fmt(r.target)+(r.issues.length?'\nDate issues: '+r.issues.join(', '):'');tr.append(main,country,next);body.append(tr)});table.append(body);wrap.append(table);root.append(wrap);
 if(!view.rows.length)root.append(el('p',result.records.length?'No key submissions match this search.':'No dated key submissions match ID and dispatch year 2026.','empty'));
 const footer=el('footer'),prev=el('button','‹ Previous'),next=el('button','Next ›');prev.disabled=view.page===0;next.disabled=view.page===view.pages-1;prev.onclick=()=>onChange({page:view.page-1,selected:null});next.onclick=()=>onChange({page:view.page+1,selected:null});footer.append(prev,el('span',view.matches.length?((view.page*10+1)+'–'+(view.page*10+view.rows.length)+' of '+view.matches.length):'0 matches'),next);root.append(footer);
 const checks=el('details',undefined,'checks');checks.append(el('summary','Scope and data checks'),el('p','Only Key Submission records in ID. One row per submission. Year uses actual dispatch, then latest planned dispatch, then original plan. Pending milestones sort by target date; missing targets last, followed by approved records.'));
 checks.append(el('p',result.undated.length+' without a dispatch date · '+result.excluded.length+' excluded for dispatch date issues · '+result.outside.length+' outside 2026 · '+result.unidentified+' key ID rows without a submission ID.'));
 const issueList=el('ul');result.excluded.forEach(x=>issueList.append(el('li',x.id+': '+x.reason)));result.undated.forEach(id=>issueList.append(el('li',id+': no dispatch date')));checks.append(issueList);root.append(checks);
 const record=result.records.find(r=>r.id===state.selected);if(record){const panel=el('section',undefined,'detailPanel');panel.setAttribute('role','dialog');panel.setAttribute('aria-label','Submission details');const close=el('button','Close details','close');close.onclick=()=>onChange({selected:null});panel.append(close,el('h2',record.id),el('p',record.status,'status '+color(record.status)));const dl=el('dl');const entries=[['Regulatory objectives',joined(record.ros)],['Products',joined(record.products)],['Countries',joined(record.countries)],['Sites',joined(record.sites)],['Business unit','ID'],['Key flag','Key Submission'],['Next milestone',record.next+' · '+fmt(record.target)],['2026 scope',record.scopeSource+' · '+fmt(record.scopeDate)],...dateRoles.map(k=>[k.replace(/([a-z])([A-Z])/g,'$1 $2'),record.dates[k].issue?'Conflicting or invalid values':fmt(record.dates[k].value)])];entries.forEach(([k,v])=>dl.append(el('dt',k),el('dd',v)));panel.append(dl);root.append(panel);close.focus?.();}
 return view;
}

const rows=Array.from({length:30},(_,i)=>({SubID:'KEY-'+String(i+1).padStart(3,'0'),ROID:'RO-'+String(i+1).padStart(3,'0'),KeySubmission:'Key Submissions',BusinessUnit:'ID',Product:['Diagnostic panel','Portable reader','Screening assay','Laboratory test kit'][i%4]+' '+(i+1),Country:['France','Germany','Spain','Italy','Ireland'][i%5],Site:['Northern site','Southern site'][i%2],SubStatus:['Planned','In Progress','Sent To Health Authority'][i%3],LatestDispatch:'2026-01-10',ActualDispatch:i%3?'2026-01-12':null,LatestSubmission:'2026-'+String(i%9+2).padStart(2,'0')+'-15',ActualSubmission:i%3===2?'2026-02-12':null,LatestApproval:'2026-11-20'}));rows.push({...rows[0],Product:'Additional assay',Country:'Portugal'});rows.push({...rows[1],SubID:'NON-KEY',KeySubmission:'Non-Key Submissions'});rows.push({...rows[1],SubID:'OTHER-BU',BusinessUnit:'CMI'});rows.push({...rows[1],SubID:'OTHER-YEAR',ActualDispatch:'2027-01-01'});const root=document.getElementById('host');let state={query:'',page:0,selected:null};function draw(){const active=document.activeElement,focused=active?.type==='search',cursor=focused?active.selectionStart:null;render(root,rows,{state,synthetic:true,onChange:patch=>{state={...state,...patch};draw();if(patch.selected)root.scrollTop=0}});if(focused&&!state.selected){const input=root.querySelector('input');input.focus();if(cursor!==null)input.setSelectionRange(cursor,cursor);}}draw();</script></html>
