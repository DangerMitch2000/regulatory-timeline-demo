name: Build Key Submissions 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'key-*'
      - '.github/workflows/key-submissions.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate separate Key Submissions project
        run: |
          node key-submissions.build.cjs
          node key-demo.cjs
      - name: Install pinned build tools
        working-directory: key-submissions
        run: npm install
      - name: Verify scope and actual visual
        run: |
          node key-test.cjs
          cd key-submissions
          npx tsc --noEmit
          npx esbuild src/visual.ts --bundle --platform=node --format=cjs --outfile=verify/visual-host.cjs --loader:.less=empty
          node ../key-host-test.cjs
          npx esbuild verify/harness.ts --bundle --outfile=verify/harness.js --loader:.less=css
          npx playwright install --with-deps chromium
          node ../key-browser-test.cjs
          npm run package
      - name: Prepare separate release
        run: |
          mkdir -p key-release
          cp key-submissions/dist/*.pbiviz key-release/key-submissions-2026-1.0.0.0.pbiviz
          cp key-submissions.README.md key-release/KEY-SUBMISSIONS-INSTALL.md
          cp key-preview.html key-release/key-demo.html
          cp key-submissions/verify/key-preview.png key-release/key-preview.png
          tar --exclude=node_modules --exclude=.tmp --exclude=dist -czf key-release/key-source.tar.gz key-submissions key-submissions.build.cjs key-submissions.logic.js key-submissions.ui.js key-submissions.css key-submissions.README.md key-test.cjs key-host-test.cjs key-browser-test.cjs key-demo.cjs
          cd key-release && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: key-submissions-2026
          path: key-release/
      - name: Publish Key Submissions preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create key-submissions-2026-v1.0.0 --target "$GITHUB_SHA" --prerelease --title "Key Submissions — 2026 (ID)" --notes "Separate Power BI visual fixed to ID business unit and dispatch year 2026, using the explicit Key Submission flag. Ten rows per page, search and selectable full details; duplicate product/country memberships count once. Other visuals unchanged. Scope, compiled host and real-browser tests passed before packaging. Fictional public demo included. Uncertified preview: actual Power BI import and model relationships need verification. See KEY-SUBMISSIONS-INSTALL.md."
          gh release upload key-submissions-2026-v1.0.0 key-release/*
